_schema-version: 3.3.0
ID: SmartWarehouse
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: SmartWarehouse-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: SmartWarehouse-db

  - name: SmartWarehouse-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: SmartWarehouse-db

    
  - name: com.smartwarehouse.smartwarehouseUI
    type: staticfile
    path: app
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:workspaces
      build-result: dist
    parameters:
      disk-quota: 256M
      memory: 256M

resources:
  - name: SmartWarehouse-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared